name: BrunOS

options:
  bundleIdPrefix: com.bruno
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "27.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    # Modo de lenguaje Swift 6: concurrencia estricta desde el primer día.
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    # El equipo de firma lo pone Bruno en Xcode; aquí se deja vacío a propósito
    # para no meter datos de la cuenta de desarrollador en un repo público.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: 0.8.0

targets:
  BrunOS:
    type: application
    platform: iOS
    sources:
      - path: BrunOS
        excludes:
          - "Resources/Blocklists/*.json"
    dependencies:
      - package: SwiftTerm
      - package: Citadel
    info:
      path: BrunOS/App/Info.plist
      properties:
        CFBundleDisplayName: BrunOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

        # iOS 27 exige ciclo de vida por escenas: sin este manifiesto la app no arranca.
        # NO se declara una escena ExternalDisplayNonInteractive: en iOS 27 el
        # contenido externo se registra desde el view controller raíz con
        # registerSceneAccessory(_:). Ver Display/ExternalDisplayManager.swift.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Phone
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).PhoneSceneDelegate

        # Obligatoria en iOS 27: sin UILaunchScreen, App Store Connect rechaza
        # la subida, también para TestFlight.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark

        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
          - JetBrainsMono-Italic.ttf
          - JetBrainsMono-BoldItalic.ttf
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf

        # brunos:// lo usa el x-callback-url de Atajos al volver del atajo
        # que activa AssistiveTouch (Fase 1).
        CFBundleURLTypes:
          - CFBundleURLName: com.bruno.brunos
            CFBundleURLSchemes:
              - brunos

        # El dictado es en el dispositivo (SpeechAnalyzer), pero iOS pide las
        # dos descripciones igual: micrófono y reconocimiento de voz.
        NSMicrophoneUsageDescription: >-
          BrunOS usa el micrófono para el dictado, que se procesa en el propio
          iPhone y no sale del dispositivo.
        NSSpeechRecognitionUsageDescription: >-
          BrunOS transcribe lo que dictas para escribirlo en el panel con foco.
          El reconocimiento ocurre en el propio iPhone.

        ITSAppUsesNonExemptEncryption: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bruno.brunos
        PRODUCT_NAME: BrunOS
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
