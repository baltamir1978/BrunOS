name: BrunOS

options:
  # Sin esto la app se declara inglesa y iOS rotula en inglés todo lo que pone
  # él: los botones «Atrás» y «Aceptar», los selectores, los menús de edición.
  # El resultado era la mitad de los ajustes en español y la mitad en inglés.
  developmentLanguage: es
  bundleIdPrefix: com.bruno
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "27.0"

# La firma va en Local.xcconfig, que no se versiona: así el equipo sobrevive a
# `xcodegen generate` y el Team ID no acaba en un repositorio público. Si no
# existe, Tools/build.sh lo crea desde Local.xcconfig.example.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    # Modo de lenguaje Swift 6: concurrencia estricta desde el primer día.
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    # Fijada a la serie 0.11 a propósito. A partir de la 0.12.1, Citadel dejó
    # de usar el fork de swift-nio-ssh de su propio autor y pasó a uno
    # personal de un tercero, con cero estrellas y por detrás del de Apple.
    # Por esa capa van las contraseñas de los servidores, así que se prefiere
    # la cadena más corta y con un responsable identificable.
    minorVersion: 0.11.0
  AMSMB2:
    # Cliente SMB, para conectarse a un servidor de red sin pasar por la app
    # Archivos (Bruno la aprobó el 23-sep-2026). Es del mismo autor desde
    # siempre y trae libsmb2 copiada dentro, del autor de libsmb2; sus únicas
    # dependencias son de Apple, y sólo para Linux y los tests. LGPL 2.1: se
    # enlaza como librería dinámica, que es lo que la licencia pide.
    url: https://github.com/amosavian/AMSMB2
    minorVersion: 4.0.3

targets:
  BrunOS:
    type: application
    platform: iOS
    sources:
      - path: BrunOS
        # Las notas para Claude viven junto al código de cada carpeta, pero no
        # van en la app: además, al llamarse todas igual, chocarían en el bundle.
        excludes:
          - "**/CLAUDE.md"
      # Los fondos van como carpeta, no aplanados, para poder pedirlos con
      # `subdirectory: "Wallpapers"` y no mezclarlos con el resto de recursos.
      - path: BrunOS/Resources/Wallpapers
        type: folder
        optional: true
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: AMSMB2
        # Es un framework dinámico (por la LGPL): si no se embebe, la app enlaza
        # contra él pero no lo lleva dentro, y en el iPhone dyld la cierra antes
        # de dibujar nada. En el simulador no se nota, porque en Debug el
        # framework está al lado, en la carpeta de compilación.
        embed: true
    info:
      path: BrunOS/App/Info.plist
      properties:
        CFBundleDisplayName: BrunOS
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

        # iOS 27 exige ciclo de vida por escenas: sin este manifiesto la app no arranca.
        # NO se declara una escena ExternalDisplayNonInteractive: en iOS 27 el
        # contenido externo se registra desde el view controller raíz con
        # registerSceneAccessory(_:). Ver Display/ExternalDisplayManager.swift.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Phone
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).PhoneSceneDelegate

        # Obligatoria en iOS 27: sin UILaunchScreen, App Store Connect rechaza
        # la subida, también para TestFlight.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Bold.ttf
          - JetBrainsMono-Italic.ttf
          - JetBrainsMono-BoldItalic.ttf
          - IBMPlexSans-Regular.ttf
          - IBMPlexSans-Medium.ttf
          - IBMPlexSans-SemiBold.ttf

        # brunos:// lo usa el x-callback-url de Atajos al volver del atajo
        # que activa AssistiveTouch (Fase 1).
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - brunos

        # El dictado es en el dispositivo (SpeechAnalyzer), pero iOS pide las
        # dos descripciones igual: micrófono y reconocimiento de voz.
        NSMicrophoneUsageDescription: >-
          BrunOS usa el micrófono para el dictado, que se procesa en el propio
          iPhone y no sale del dispositivo.
        NSSpeechRecognitionUsageDescription: >-
          BrunOS transcribe lo que dictas para escribirlo en el panel con foco.
          El reconocimiento ocurre en el propio iPhone.

        # Sin esta clave iOS **no entrega los eventos de puntero indirecto** a
        # la app, y el ratón deja de existir para BrunOS. Va aquí y no como
        # INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: ese prefijo
        # sólo lo aplica Xcode cuando genera el Info.plist él, y aquí hay uno
        # explícito, así que se ignoraba sin avisar de nada.
        UIApplicationSupportsIndirectInputEvents: true

        # Para que lo descargado en el navegador se vea también desde la app
        # Archivos del iPhone, no sólo desde el gestor de BrunOS.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

        # Videollamadas desde el navegador.
        NSCameraUsageDescription: >-
          Algunas webs piden la cámara para videollamadas. BrunOS sólo se la
          cede a la página que la pida y cuando tú lo autorices.

        # Sin esto iOS no deja hablar con máquinas de la red local, y un
        # servidor SMB de casa suele estar ahí.
        NSLocalNetworkUsageDescription: >-
          BrunOS se conecta a los servidores de ficheros (SMB) y a las máquinas
          SSH de tu red que tú configures.

        ITSAppUsesNonExemptEncryption: false

    settings:
      base:
        PRODUCT_NAME: BrunOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        # Un solo puente a Objective-C, para una API de iOS 27 que Swift no
        # puede llamar. Ver BrunOS/Phone/BrunOSAudioTap.h.
        SWIFT_OBJC_BRIDGING_HEADER: BrunOS/App/BrunOS-Bridging-Header.h
        SWIFT_PRECOMPILE_BRIDGING_HEADER: YES
